<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JARVIS HUD</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-blue: #0066ff;
            --dark-bg: #030914;
            --neon-red: #ff003c;
            --neon-red-dark: #990024;
            --amber: #ffbc00;
            --green: #00ffaa;

            /* Dynamische Variablen für JavaScript-Wechsel */
            --active-core: var(--neon-cyan);
            --active-inner: var(--neon-blue);
            --active-glow: rgba(0, 243, 255, 0.35);
        }
        * { box-sizing: border-box; }
        body {
            background: #030914;
            color: #00f3ff;
            font-family: monospace;
            margin: 0;
            padding: 14px 20px 20px 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.08) 0%, transparent 80%), linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 100%, 100% 4px;
        }

        /* ---------- Kopfzeile: Uhr, Datum, Wetter ---------- */
        .topbar { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 8px 16px; border: 1px solid #0066ff; border-radius: 4px; background: rgba(3, 15, 30, 0.8); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }
        .clock { font-size: 40px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 12px rgba(0, 243, 255, 0.6); line-height: 1; }
        .clock small { font-size: 18px; opacity: 0.6; letter-spacing: 1px; margin-left: 4px; }
        .datebox { font-size: 15px; line-height: 1.35; }
        .datebox .tag { font-size: 18px; font-weight: bold; }
        .datebox .sub { opacity: 0.65; }
        .wetter { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .wetter .sym { font-size: 34px; line-height: 1; }
        .wetter .temp { font-size: 28px; font-weight: bold; }
        .wetter .desc { font-size: 13px; line-height: 1.35; opacity: 0.85; }
        .tage { display: flex; gap: 8px; }
        .tag-chip { border: 1px solid rgba(0, 102, 255, 0.7); border-radius: 3px; padding: 3px 8px; font-size: 12px; text-align: center; min-width: 74px; }
        .tag-chip b { display: block; font-size: 11px; opacity: 0.7; font-weight: normal; }
        .spacer { flex: 1; }
        a.badge { color: var(--neon-cyan); text-decoration: none; } a.badge:hover { background: #0066ff; color: #fff; }
        .badge b { color: #fff; margin-left: 4px; }
        .badge { font-size: 12px; border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 3px; padding: 3px 8px; opacity: 0.8; }

        .hud-container { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 20px; flex: 1; min-height: 0; }
        .panel { background: rgba(3, 15, 30, 0.8); border: 1px solid #0066ff; padding: 16px 20px; border-radius: 4px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        h2 { border-bottom: 1px solid #00f3ff; padding-bottom: 5px; font-size: 14px; text-transform: uppercase; margin-top: 0; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        h2 .tabs { margin-left: auto; display: flex; gap: 6px; }
        .tab { padding: 3px 12px; font-size: 12px; background: transparent; border: 1px solid #0066ff; color: #00f3ff; cursor: pointer; }
        .tab.active { background: #0066ff; color: #fff; }

        #tree-display { overflow-y: auto; flex: 1; min-height: 0; line-height: 1.5; }
        #graph-wrap { position: relative; flex: 1; min-height: 0; display: none; border: 1px solid rgba(0, 102, 255, 0.5); background: #000; }
        #graph-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
        #vk-panel { flex: 1; min-height: 0; overflow-y: auto; display: none; }
        .vk-item { border: 1px solid rgba(0,102,255,0.5); background: rgba(0,20,40,0.6); padding: 8px 10px; margin-bottom: 8px; border-radius: 3px; }
        .vk-titel { font-size: 13px; line-height: 1.4; } .vk-titel b { color: #ff2bd6; }
        .vk-wert { font-size: 11px; opacity: .7; margin: 3px 0 6px; }
        .vk-item button { margin-right: 6px; padding: 2px 10px; font-size: 12px; background: transparent; border: 1px solid #00f3ff; color: #00f3ff; cursor: pointer; }
        .vk-item button.nein { border-color: #ff5577; color: #ff5577; }
        .vk-item button:disabled { opacity: .4; cursor: default; }
        #vk-hinweis { font-size: 12px; opacity: .8; margin-bottom: 8px; }
        #graph-info { position: absolute; left: 8px; bottom: 6px; font-size: 11px; opacity: 0.7; pointer-events: none; }
        #graph-legend { position: absolute; right: 8px; top: 6px; font-size: 11px; opacity: 0.75; pointer-events: none; text-align: right; }

        /* Dynamisch anpassbarer Core-Reactor */
        /* JARVIS-Ring (Canvas, siehe JarvisRing weiter unten) */
        .core-reactor { flex: 1 1 0; min-height: 60px; max-height: 560px; aspect-ratio: 1 / 1; max-width: 100%; margin: 0 auto 6px auto; }
        #ring-canvas { width: 100%; height: 100%; display: block; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        #status-display { font-size: 22px; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .kern-wrap { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* ---------- Timer / Wecker / Erinnerungen ---------- */
        #zeit-strip { display: none; margin-bottom: 8px; border: 1px solid rgba(255, 188, 0, 0.6); padding: 6px 10px; max-height: 150px; overflow-y: auto; }
        #zeit-strip.zeigen { display: block; }
        .z-item { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 14px; }
        .z-item .ico { width: 20px; text-align: center; }
        .z-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .z-item .rest { color: var(--amber); font-weight: bold; min-width: 76px; text-align: right; }
        .z-item.klingelt { color: #fff; background: rgba(255, 0, 60, 0.35); animation: blink 0.9s infinite; padding: 4px 6px; }
        .z-item .x { padding: 0 8px; background: transparent; color: #00f3ff; border: 1px solid #0066ff; }
        .z-item .x:hover { background: #ff003c; color: #fff; }
        #zeit-ok { display: none; margin: 0 0 6px 0; width: 100%; background: #ff003c; font-weight: bold; }
        #zeit-ok.zeigen { display: block; }

        #termine-strip { display: none; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 6px 16px; font-size: 14px; border: 1px solid #0066ff; border-radius: 4px; background: rgba(3, 15, 30, 0.8); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }
        #termine-strip::before { content: "TERMINE"; font-size: 12px; letter-spacing: 2px; opacity: .55; margin-right: 6px; }
        #termine-strip .trm { border: 1px solid rgba(0,243,255,.35); border-radius: 3px; padding: 2px 10px; opacity: .9; }
        #termine-strip .trm.nah { border-color: var(--neon-amber, #ffbc00); color: #ffbc00; opacity: 1; }
        #cmd-terminal-box {
            background: #000; border: 1px solid #0066ff; color: #00f3ff;
            padding: 10px; flex: 0 0 32vh; min-height: 110px; overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap; margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0, 102, 255, 0.3);
        }

        .input-line { display: flex; gap: 10px; flex-wrap: wrap; }
        input { flex: 1; min-width: 160px; background: #000; border: 1px solid #0066ff; color: #00f3ff; padding: 10px; font-family: inherit; outline: none; }
        button { background: #0066ff; border: none; color: #fff; padding: 10px 16px; cursor: pointer; font-family: inherit; }
        button:hover { background: #00f3ff; color: #000; }
        .shutdown-btn { background: #ff003c !important; }
        .shutdown-btn:hover { background: #ff0000 !important; color: #fff !important; }
        .mic-btn.muted { background: #ff003c; }
        .mic-btn.muted:hover { background: #ff0000; color: #fff; }
        .folder-item { color: #ffbc00; font-weight: bold; cursor: pointer; user-select: none; }
        .folder-item:hover { text-shadow: 0 0 8px rgba(255, 188, 0, 0.8); }
        .tree-cnt { opacity: 0.55; font-weight: normal; font-size: 12px; }
        .tree-kids { margin-left: 18px; border-left: 1px solid rgba(0, 102, 255, 0.35); padding-left: 8px; }
        .tree-file { cursor: pointer; padding: 1px 0; }
        .tree-file:hover { text-shadow: 0 0 8px rgba(0, 255, 170, 0.8); }
        .file-item { color: #00ffaa; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="clock" id="clock">--:--<small id="clock-sec">:--</small></div>
        <div class="datebox"><div class="tag" id="date-tag">-</div><div class="sub" id="date-sub">-</div></div>
        <div class="wetter" id="wetter"><span class="desc">Wetter wird geladen ...</span></div>
        <div class="spacer"></div>
        <div class="badge" id="stt-badge" title="Spracherkennung">🎙 -</div>
    </div>

    <div id="termine-strip"></div>

    <div class="hud-container">
        <div class="panel">
            <h2>Archiv Matrix
                <span class="tabs">
                    <button class="tab" id="tree-open" style="display:none" title="Alle Ordner aufklappen" onclick="treeAll(true)">⊞</button>
                    <button class="tab" id="tree-close" style="display:none" title="Alle Ordner zuklappen" onclick="treeAll(false)">⊟</button>
                    <button class="tab active" id="tab-graph" onclick="showTab('graph')">GRAPH</button>
                    <button class="tab" id="tab-baum" onclick="showTab('baum')">BAUM</button>
                    <button class="tab" id="tab-links" title="Fehlende Verknüpfungen zwischen Notizen" onclick="showTab('links')">LINKS</button>
                </span>
            </h2>
            <div id="tree-display" style="display:none">Lade Dateisystem...</div>
            <div id="vk-panel"><div id="vk-hinweis"></div><div id="vk-liste"></div></div>
            <div id="graph-wrap">
                <canvas id="graph-canvas"></canvas>
                <div id="graph-legend"></div>
                <div id="graph-info">Klick: Notiz öffnen · Ziehen: Knoten bewegen · Mausrad: Zoom</div>
            </div>
        </div>
        <div class="panel">
            <h2>JARVIS Zentral-Kern</h2>
            <div class="kern-wrap">
                <div id="core" class="core-reactor"><canvas id="ring-canvas"></canvas></div>
                <div id="status-display">STANDBY</div>
            </div>

            <button id="zeit-ok" onclick="zeitAck()">✔ OK – Alarm beenden</button>
            <div id="zeit-strip"></div>

            <div class="input-line">
                <input type="text" id="cmd-input" placeholder="BEFEHL EINGEBEN..." autocomplete="off">
                <button id="mic-btn" class="mic-btn" onclick="toggleMic()">🎤 MIKRO AN</button>
                <button class="shutdown-btn" onclick="triggerShutdown()">POWER OFF</button>
            </div>
            <div id="cmd-terminal-box">Koppele Live-Konsole...</div>
        </div>
    </div>
    <script>
// Jeder Jarvis-Tab hat einen festen Namen. Ein Klick springt in den vorhandenen Tab, statt einen neuen zu öffnen.
window.name = 'jarvis_hud';
function zuTab(e, url, name) {
    e.preventDefault();
    const w = window.open('', name);
    if (!w) { location.href = url; return; }
    try { if (w.location.href === 'about:blank') w.location.href = url; } catch (_) { w.location.href = url; }
    w.focus();
}
        /* ======================= JARVIS-Ring ======================= */
/* JARVIS-Ring: drei eigene Entwürfe auf einer Canvas.
   Benutzung:  const ring = JarvisRing.erzeuge(canvasElement, { variante: 'A' | 'B' | 'C', mitte: 'zeit' | 'leer' });
               ring.setZustand('PROCESSING');   // ONLINE, STANDBY, PROCESSING, AUDIO-AUSGABE, SCANNING, SEARCHING, OFFLINE
               ring.setStumm(true);             // Mikrofon aus
               ring.setAlarm(true);             // Timer klingelt */
const JarvisRing = (() => {
    const ZUSTAENDE = {
        'ONLINE':        { farbe: [0, 243, 255],  tempo: 1.0, pegel: 0.10, modus: 'ruhe' },
        'STANDBY':       { farbe: [0, 243, 255],  tempo: 0.8, pegel: 0.08, modus: 'ruhe' },
        'PROCESSING':    { farbe: [255, 188, 0],  tempo: 3.0, pegel: 0.40, modus: 'denken' },
        'AUDIO-AUSGABE': { farbe: [255, 0, 60],   tempo: 1.6, pegel: 0.90, modus: 'sprechen' },
        'SCANNING':      { farbe: [0, 255, 170],  tempo: 2.0, pegel: 0.40, modus: 'suchen' },
        'SEARCHING':     { farbe: [0, 255, 170],  tempo: 2.0, pegel: 0.40, modus: 'suchen' },
        'ERKENNUNG':     { farbe: [180, 110, 255], tempo: 1.8, pegel: 0.30, modus: 'hoeren' },
        'OFFLINE':       { farbe: [80, 100, 130], tempo: 0.2, pegel: 0.00, modus: 'ruhe' },
    };
    const STUMM = { farbe: [110, 130, 165], tempo: 0.5, pegel: 0.03, modus: 'ruhe' };
    const ALARM = { farbe: [255, 120, 0], tempo: 2.2, pegel: 0.75, modus: 'sprechen' };
    const TAU = Math.PI * 2;
    const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
    const lerp = (a, b, k) => a + (b - a) * k;
    const mod = (a, n) => ((a % n) + n) % n;
    const winkelDiff = (a, b) => { let d = Math.abs(mod(a - b, TAU)); return d > Math.PI ? TAU - d : d; };

    // pseudo-zufällige, aber stabile Zahl aus einer Ganzzahl
    const zufall = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

    function erzeuge(canvas, opt = {}) {
        const ctx = canvas.getContext('2d');
        const variante = opt.variante || 'A';
        const mitte = opt.mitte || 'zeit';
        const st = { farbe: [0, 243, 255], tempo: 1, pegel: 0.1, ziel: ZUSTAENDE.ONLINE, name: 'ONLINE', stumm: false, alarm: false,
                     pegelWeich: 0.1, phase: 0, t0: performance.now(), laeuft: true, blips: [], letzteBlip: 0 };
        let W = 300, H = 300, dpr = 1, raf = 0;

        function groesse() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            const r = canvas.getBoundingClientRect();
            W = Math.max(80, r.width); H = Math.max(80, r.height);
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        }
        groesse();
        const ro = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(groesse) : null;
        if (ro) ro.observe(canvas);

        const aktuellesZiel = () => st.alarm ? ALARM : (st.stumm ? STUMM : st.ziel);

        // ---------- gemeinsame Zeichenhilfen ----------
        function glimmen(c, breite, alpha, zeichne) {                       // Leuchteffekt ohne teures shadowBlur
            ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
            ctx.strokeStyle = rgba(c, alpha * 0.18); ctx.lineWidth = breite * 4.5; zeichne();
            ctx.strokeStyle = rgba(c, alpha * 0.40); ctx.lineWidth = breite * 2.2; zeichne();
            ctx.strokeStyle = rgba(c, alpha);        ctx.lineWidth = breite;       zeichne();
            ctx.restore();
        }
        function kugel(x, y, r, c, a) {                                       // weicher Lichtpunkt
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, rgba(c, a)); g.addColorStop(0.35, rgba(c, a * 0.45)); g.addColorStop(1, rgba(c, 0));
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        }
        function mitteText(R, c, t, y0 = 0, groesse = 0.17) {
            if (mitte !== 'zeit') return;
            const d = new Date(); const s = String(d.getHours()).padStart(2, '0') + (Math.floor(t) % 2 ? ' ' : ':') + String(d.getMinutes()).padStart(2, '0');
            ctx.save(); ctx.translate(0, y0); ctx.font = `bold ${Math.round(R * groesse)}px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rgba(c, 0.25); ctx.fillText(s, 0, 1); ctx.fillText(s, 0, -1);
            ctx.fillStyle = rgba(c, 0.95); ctx.fillText(s, 0, 0); ctx.restore();
        }
        // Sprachhüllkurve: wirkt wie Silben, ohne echtes Audio
        const huelle = (t) => Math.min(1, 0.35 + 0.65 * Math.abs(Math.sin(t * 6.1) * Math.sin(t * 2.3 + 1.2) + 0.5 * Math.sin(t * 11.7)));

        // ---------- Entwurf A: Spektrum-Ring ----------
        function zeichneA(R, c, t, pegel, modus) {
            const N = 72, rb = R * 0.50, lmax = R * 0.30;
            // äußerer Ring mit Lücken, dreht langsam
            const a0 = t * 0.18 * st.tempo;
            glimmen(c, R * 0.012, 0.9, () => { for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(0, 0, R * 0.96, a0 + k * TAU / 4 + 0.12, a0 + (k + 1) * TAU / 4 - 0.12); ctx.stroke(); } });
            // Skala
            ctx.save(); ctx.rotate(-t * 0.05 * st.tempo); ctx.strokeStyle = rgba(c, 0.5); ctx.lineWidth = R * 0.006;
            for (let i = 0; i < 120; i++) { const a = i * TAU / 120, l = i % 10 === 0 ? 0.045 : 0.02; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 0.88, Math.sin(a) * R * 0.88); ctx.lineTo(Math.cos(a) * R * (0.88 - l), Math.sin(a) * R * (0.88 - l)); ctx.stroke(); }
            ctx.restore();
            // Balken
            const kopf = t * st.tempo * 1.3, ping = (t * 0.55) % 1;
            for (let i = 0; i < N; i++) {
                const a = i * TAU / N - Math.PI / 2;
                let amp = 0.10 + 0.07 * Math.sin(t * 1.4 + i * 0.35) + 0.04 * Math.sin(t * 0.7 - i * 0.12);    // ruhiges Atmen
                if (modus === 'sprechen') amp += pegel * huelle(t) * (0.45 + 0.55 * Math.abs(Math.sin(i * 0.45 + t * 6) * Math.sin(i * 0.17 - t * 2.3)));
                if (modus === 'denken') amp += Math.max(0, 1 - winkelDiff(a, kopf) / 1.1) * 0.9;
                if (modus === 'hoeren') amp += 0.35 * Math.abs(Math.sin(i * 0.5 + t * 7) * Math.sin(i * 0.23 - t * 3.1));
                if (modus === 'suchen') amp += Math.max(0, 1 - Math.abs(mod(i / N - ping, 1) - 0) * 7) * 0.6 + 0.2 * Math.abs(Math.sin(i * 0.6 - t * 4));
                amp = Math.min(1, amp);
                const x1 = Math.cos(a) * rb, y1 = Math.sin(a) * rb, x2 = Math.cos(a) * (rb + lmax * amp + R * 0.02), y2 = Math.sin(a) * (rb + lmax * amp + R * 0.02);
                ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
                ctx.strokeStyle = rgba(c, 0.18 + 0.32 * amp); ctx.lineWidth = R * 0.05; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                ctx.strokeStyle = rgba(c, 0.45 + 0.55 * amp); ctx.lineWidth = R * 0.022; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                ctx.restore();
            }
            // innerer Kern
            const atem = 0.5 + 0.5 * Math.sin(t * 1.6);
            ctx.save(); ctx.globalCompositeOperation = 'lighter';
            kugel(0, 0, R * (0.40 + 0.06 * pegel * huelle(t) + 0.02 * atem), c, 0.16 + 0.26 * pegel);
            ctx.restore();
            glimmen(c, R * 0.008, 0.7, () => { ctx.beginPath(); ctx.arc(0, 0, R * 0.44, 0, TAU); ctx.stroke(); });
            mitteText(R, c, t);
        }

        // ---------- Entwurf B: Orbit & Partikel ----------
        const ORBITEN = [ { rx: 0.88, ry: 0.34, neigung: 0.0, tempo: 0.55, n: 3 }, { rx: 0.80, ry: 0.30, neigung: 1.05, tempo: -0.70, n: 2 }, { rx: 0.72, ry: 0.26, neigung: 2.10, tempo: 0.85, n: 3 } ];
        function zeichneB(R, c, t, pegel, modus) {
            // Partikelstaub
            ctx.save(); ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 110; i++) {
                const r = R * (0.30 + 0.68 * zufall(i)), a = zufall(i + 99) * TAU + t * (0.02 + 0.06 * zufall(i + 7)) * st.tempo * (i % 2 ? 1 : -1);
                const tw = 0.25 + 0.75 * Math.abs(Math.sin(t * (0.6 + zufall(i + 3) * 1.6) + i));
                ctx.fillStyle = rgba(c, 0.10 + 0.55 * tw * (0.4 + pegel)); ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, R * (0.004 + 0.007 * zufall(i + 5)), 0, TAU); ctx.fill();
            }
            ctx.restore();
            // Bahnen mit wandernden Lichtpunkten und Schweif
            ORBITEN.forEach((o, k) => {
                const praez = t * 0.05 * st.tempo, puls = 1 + (modus === 'sprechen' ? 0.07 * pegel * huelle(t + k) * Math.sin(t * 9 + k) : 0.012 * Math.sin(t + k));
                const rx = R * o.rx * puls, ry = R * o.ry * puls, neigung = o.neigung + praez * (k % 2 ? -1 : 1);
                ctx.save(); ctx.rotate(neigung);
                glimmen(c, R * 0.007, 0.5, () => { ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.stroke(); });
                for (let d = 0; d < o.n; d++) {
                    const a = t * o.tempo * st.tempo * 0.9 + d * TAU / o.n;
                    for (let s = 14; s >= 0; s--) {                                      // Schweif
                        const aa = a - s * 0.07 * Math.sign(o.tempo), x = Math.cos(aa) * rx, y = Math.sin(aa) * ry, f = 1 - s / 15;
                        ctx.save(); ctx.globalCompositeOperation = 'lighter'; kugel(x, y, R * (0.012 + 0.03 * f * f), c, 0.15 + 0.85 * f * f); ctx.restore();
                    }
                }
                ctx.restore();
            });
            // Kern-Plasma
            const atem = 1 + 0.07 * Math.sin(t * 1.7), kr = R * 0.22 * atem * (1 + (modus === 'sprechen' ? 0.30 * pegel * huelle(t) : 0));
            ctx.save(); ctx.globalCompositeOperation = 'lighter';

            const w = cv.clientWidth, h = cv.clientHeight, D = G.R * 3.2;
            const cy_ = Math.cos(cam.yaw), sy_ = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
            G.nodes.forEach(n => {
                const x1 = n.x * cy_ + n.z * sy_, z1 = -n.x * sy_ + n.z * cy_;
                const y2 = n.y * cp - z1 * sp, z2 = n.y * sp + z1 * cp;
                const s = view.k * D / (D + z2);
                n.sx = w / 2 + x1 * s; n.sy = h / 2 + y2 * s; n.sr = n.r * Math.sqrt(view.k) * D / (D + z2); n.tz = z2;
            });
        }
        function tiefe(z) { return Math.max(0, Math.min(1, 1 - (z + G.R) / (2 * G.R))); }   // 1 = vorne, 0 = hinten
        // Zentraler Archiv-Knoten: pulsierender Kern, auslaufende Radar-Welle und zwei kreisende Bahnen mit Satelliten
        function zeichneWurzel(x, y, r0, a) {
            const T = performance.now() / 1000, R = r0 * 1.9, TAU = 6.2832;
            ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = 1.3;
            const ph = (T * 0.45) % 1;                                              // Welle
            ctx.beginPath(); ctx.arc(x, y, R * (1.2 + 2.6 * ph), 0, TAU);
            ctx.strokeStyle = 'rgba(0,243,255,' + (0.55 * (1 - ph)).toFixed(2) + ')'; ctx.stroke();
            [[R * 2.5, R * 0.95, T * 0.8, 2.3], [R * 2.0, R * 0.7, -T * 0.55 + 1.2, -3.1]].forEach(([ra, rb, rot, sp], i) => {
                ctx.beginPath(); ctx.ellipse(x, y, ra, rb, rot, 0, TAU);
                ctx.strokeStyle = i ? 'rgba(255,255,255,0.35)' : 'rgba(0,243,255,0.5)'; ctx.stroke();
                const ang = T * sp, px = x + Math.cos(rot) * ra * Math.cos(ang) - Math.sin(rot) * rb * Math.sin(ang),
                      py = y + Math.sin(rot) * ra * Math.cos(ang) + Math.cos(rot) * rb * Math.sin(ang);
                ctx.beginPath(); ctx.arc(px, py, Math.max(1.6, r0 * 0.28), 0, TAU);
                ctx.fillStyle = i ? '#ffffff' : '#00f3ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
            });
            const puls = 1 + 0.16 * Math.sin(T * 2.4);                              // Kern
            const g = ctx.createRadialGradient(x, y, 0, x, y, R * puls);
            g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, 'rgba(160,250,255,0.95)'); g.addColorStop(1, 'rgba(0,243,255,0.15)');
            ctx.beginPath(); ctx.arc(x, y, R * puls, 0, TAU); ctx.fillStyle = g;
            ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 16 + 10 * Math.sin(T * 2.4); ctx.fill();
            ctx.restore();
        }
        function draw() {
            // Puffergröße immer an die tatsächlich angezeigte Größe anpassen (das Layout verschiebt sich z.B. wenn die Termine-Zeile erscheint),
            // sonst bleibt am Rand ein ungelöschter Streifen und beim Zoomen "schmiert" das Bild
            const dpr = window.devicePixelRatio || 1;
            if (cv.width !== Math.round(cv.clientWidth * dpr) || cv.height !== Math.round(cv.clientHeight * dpr)) graphResize();
            const w = cv.clientWidth, h = cv.clientHeight;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, cv.width, cv.height);                                 // ganzen Puffer löschen
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            projiziere();
            const fokus = hover || null;
            G.links.forEach(l => {
                const aktiv = fokus && (l.a === fokus || l.b === fokus);
                const t = tiefe((l.a.tz + l.b.tz) / 2), a = 0.15 + 0.85 * t;
                ctx.beginPath(); ctx.moveTo(l.a.sx, l.a.sy); ctx.lineTo(l.b.sx, l.b.sy);
                ctx.strokeStyle = aktiv ? 'rgba(255,255,255,0.95)' : l.k === 'l' ? `rgba(0,243,255,${(0.75 * a).toFixed(2)})` : `rgba(0,102,255,${(0.32 * a).toFixed(2)})`;
                ctx.lineWidth = (l.k === 'l' ? 1.4 : 0.8) * (0.6 + 0.6 * t);
                ctx.stroke();
            });
            const T = performance.now() / 1000;
            const reihe = G.nodes.slice().sort((p, q) => q.tz - p.tz);            // hinten zuerst
            reihe.forEach(n => {
                const x = n.sx, y = n.sy;
                if (x < -20 || y < -20 || x > w + 20 || y > h + 20) return;
                const t = tiefe(n.tz), dim = fokus && n !== fokus && !fokus.nb.has(n);
                const istIndex = n.type !== 'folder' && n.type !== 'root' && /\bindex\b/i.test(n.name || '');
                const c = n.type === 'root' ? '#ffffff' : n.type === 'folder' ? '#ffbc00' : istIndex ? '#ff2bd6' :
                    n.type === 'pdf' ? '#ff5577' : (n.deg || 0) > 0 ? '#00f3ff' : 'hsl(' + farbe(n.grp) + ',100%,60%)';   // Notizen mit [[Links]] = Farbe der Verknüpfungslinien, Index = Magenta
                ctx.globalAlpha = dim ? 0.15 : 0.35 + 0.65 * t;
                const rad = Math.max(1.2, n.sr) * (istIndex ? 1.35 : 1);
                if (n.type === 'root') zeichneWurzel(x, y, Math.max(6, n.sr), dim ? 0.3 : 1);
                else {
                    if (istIndex && !dim) {                                           // sanft pulsierender Ring um Index-Notizen
                        const p = 0.5 + 0.5 * Math.sin(T * 3 + n.x * 0.05);
                        ctx.beginPath(); ctx.arc(x, y, rad * (1.6 + 0.5 * p), 0, 6.2832);
                        ctx.strokeStyle = 'rgba(255,43,214,' + (0.15 + 0.35 * (1 - p)).toFixed(2) + ')'; ctx.lineWidth = 1.2; ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832);
                    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = n === fokus ? 18 : (istIndex ? 10 : 3) + 6 * t;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
                const zeigeName = n === fokus || n.type === 'root' || (fokus && fokus.nb.has(n)) || ((n.type !== 'note' || (n.deg || 0) >= 4 || view.k > 1.5) && t > 0.45);
                if (zeigeName && !dim) {
                    ctx.font = (n === fokus ? 'bold 13px' : '11px') + ' monospace';
                    ctx.fillStyle = n === fokus ? '#fff' : 'rgba(210,255,255,0.85)';
                    ctx.fillText(n.name, x + n.sr + 4, y + 4);
                }
                ctx.globalAlpha = 1;
            });
        }
        function loop(ts) {
            rafId = null;
            if (aktiverTab !== 'graph' || isShuttingDown) return;
            const dt = cam.last ? Math.min(0.1, (ts - cam.last) / 1000) : 0.016; cam.last = ts;
            if (alpha > 0.002) simStep();
            if (cam.auto && !drag && ts > cam.pause) cam.yaw += dt * 0.28;           // dreht sich langsam um die Hochachse
            draw();
            rafId = requestAnimationFrame(loop);                                      // läuft immer weiter: der Archiv-Knoten ist animiert
        }
        function graphStart() { if (!rafId && aktiverTab === 'graph') rafId = requestAnimationFrame(loop); }
        function pickNode(mx, my) {
            let best = null, bd = 1e9;
            G.nodes.forEach(n => {
                const d = (n.sx - mx) ** 2 + (n.sy - my) ** 2, r = Math.max(4, n.sr) + 5;
                if (d < r * r && (best === null || n.tz < best.tz)) { best = n; bd = d; }     // vorderster Treffer
            });
            return best;
        }
        function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
        cv.addEventListener('mousedown', e => {
            const [mx, my] = pos(e); moved = false;
            drag = { x: mx, y: my, yaw: cam.yaw, pitch: cam.pitch, n: pickNode(mx, my) };
            cv.style.cursor = 'grabbing'; graphStart();
        });
        window.addEventListener('mousemove', e => {
            if (aktiverTab !== 'graph') return;
            const [mx, my] = pos(e);
            if (drag) {
                if (Math.abs(mx - drag.x) + Math.abs(my - drag.y) > 3) moved = true;
                cam.yaw = drag.yaw + (mx - drag.x) * 0.008;
                cam.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (my - drag.y) * 0.008));
            } else {
                const n = pickNode(mx, my);
                if (n !== hover) { hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; }
            }
            graphStart();
        });
        window.addEventListener('mouseup', () => {
            if (drag) {
                if (!moved && drag.n && drag.n.type !== 'folder' && drag.n.type !== 'root') {
                    fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: drag.n.id }) });
                }
                cam.pause = performance.now() + 2500;                                   // nach dem Drehen kurz Ruhe
            }
            drag = null; cv.style.cursor = 'grab'; graphStart();
        });
        cv.addEventListener('dblclick', () => { cam.auto = !cam.auto; $('graph-info').textContent = graphHinweis(); graphStart(); });
        cv.addEventListener('wheel', e => {
            e.preventDefault();
            view.k = Math.max(0.2, Math.min(6, view.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
            graphStart();
        }, { passive: false });
        function graphHinweis() { return 'Ziehen: drehen · Mausrad: Zoom · Klick: Notiz öffnen · Doppelklick: Drehung ' + (cam.auto ? 'anhalten' : 'starten'); }
        $('graph-info').textContent = graphHinweis();
        window.addEventListener('resize', () => { if (aktiverTab === 'graph') { graphResize(); graphStart(); } });
        if (window.ResizeObserver) new ResizeObserver(() => { if (aktiverTab === 'graph') { graphResize(); graphStart(); } }).observe($('graph-wrap'));

        /* ======================= Daten / Befehle ======================= */
        function updateData() {
            if (isShuttingDown) return;

            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    setzeBaum(data.tree || "Keine Daten.");
                    $('status-display').innerText = (data.status === 'ERKENNUNG') ? 'ERKENNE SPRACHE' : (data.status || "ONLINE");
                    $('stt-badge').textContent = '🎙 ' + (data.stt || '-');
                    setMicButton(!!data.mic_muted);
                    {
                        const el = $('termine-strip'), t = data.termine || [];
                        el.style.display = t.length ? 'flex' : 'none';
                        el.innerHTML = t.map(x => '<span class="trm' + (x.tage <= 1 ? ' nah' : '') + '">' +
                            (x.art === 'jubilaeum' ? '💍 ' : x.gedenken ? '🕯 ' : '🎂 ') + x.wer + (x.jahre ? ' (' + x.jahre + ')' : '') +
                            ' · ' + (x.tage === 0 ? 'heute' : x.tage === 1 ? 'morgen' : 'in ' + x.tage + ' Tg.') + '</span>').join('');
                    }
                    {
                        const el = $('termine-strip'), kk = data.kalender || [];
                        if (kk.length) {
                            el.style.display = 'flex';
                            el.innerHTML += kk.map(x => '<span class="trm' + (x.tage === 0 ? ' nah' : '') + '">📅 ' + x.titel + ' · ' + (x.tage === 0 ? '' : x.tage === 1 ? 'morgen ' : 'in ' + x.tage + ' Tg. ') + x.zeit + '</span>').join('');
                        }
                    }
                    {
                        const el = $('termine-strip'), mm = data.muell || [];
                        const FARBE = { grau: '#9aa5b1', blau: '#4d9fff', braun: '#b9824a', gelb: '#ffd400', gruen: '#3ddc84', 'grün': '#3ddc84' };
                        if (mm.length) {
                            el.style.display = 'flex';
                            el.innerHTML += mm.map(x => '<span class="trm' + (x.tage <= 1 ? ' nah' : '') + '">🗑 ' +
                                (x.farben || []).map(f => '<span style="color:' + (FARBE[f] || '#00f3ff') + '">●</span>').join('') + ' ' +
                                x.namen.join(', ').replace(/[<>&]/g, '') + ' · ' + (x.tage === 0 ? 'heute' : x.tage === 1 ? 'morgen' : 'in ' + x.tage + ' Tg.') + '</span>').join('');
                        }
                    }
                    if (data.haus && $('haus-w')) {
                        const w = data.haus.haus_w != null ? data.haus.haus_w : data.haus.steckdosen_w;
                        $('haus-w').textContent = (w == null ? '–' : (w >= 1000 ? (w / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(w) + ' W')) +
                            (data.haus.fenster_offen ? '  ⚠ ' + data.haus.fenster_offen + ' Fenster offen' : '');
                    }
                    if (typeof data.graph_version === 'number' && data.graph_version !== graphVersion && aktiverTab === 'graph') ladeGraph(true);
                    if (typeof data.graph_version === 'number' && aktiverTab === 'baum') window._gv = data.graph_version;

                    // Ring: Farbe und Bewegung folgen dem Zustand (ONLINE, PROCESSING, AUDIO-AUSGABE, SEARCHING ...)
                    jarvisRing.setZustand(data.status || 'ONLINE');
                    jarvisRing.setStumm(!!data.mic_muted);

                    if (data.status === "OFFLINE") {
                        isShuttingDown = true;
                        setTimeout(() => { window.close(); }, 800);
                    }
                })
                .catch(err => console.error("API-Fehler:", err));

            fetch('/api/logs')
                .then(res => res.json())
                .then(data => {
                    if (data && data.logs) {
                        const box = $('cmd-terminal-box');
                        box.textContent = data.logs.join('\n');
                        box.scrollTop = box.scrollHeight;
                    }
                })
                .catch(err => console.error("Log-API Fehler:", err));
            ladeZeit();
        }

        function setMicButton(muted) {
            const btn = $('mic-btn');
            btn.classList.toggle('muted', muted);
            btn.textContent = muted ? "🔇 MIKRO STUMM" : "🎤 MIKRO AN";
        }

        function toggleMic() {
            fetch("/api/mic", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(data => { setMicButton(!!data.muted); updateData(); })
            .catch(err => console.error("Mikro-API Fehler:", err));
        }

        /* ======================= Befehlsverlauf (Pfeil hoch/runter) ======================= */
        let verlaufBefehle = [], verlaufIdx = 0, verlaufEntwurf = '';
        try { verlaufBefehle = JSON.parse(localStorage.getItem('jarvis_befehle') || '[]').filter(x => typeof x === 'string').slice(-50); } catch (e) {}
        verlaufIdx = verlaufBefehle.length;
        function verlaufMerken(cmd) {
            if (verlaufBefehle[verlaufBefehle.length - 1] !== cmd) verlaufBefehle.push(cmd);
            verlaufBefehle = verlaufBefehle.slice(-50);
            verlaufIdx = verlaufBefehle.length; verlaufEntwurf = '';
            try { localStorage.setItem('jarvis_befehle', JSON.stringify(verlaufBefehle)); } catch (e) {}
        }
        function verlaufTaste(e) {
            const input = e.target;
            if (e.key === 'ArrowUp') {
                if (!verlaufBefehle.length) return;
                e.preventDefault();
                if (verlaufIdx === verlaufBefehle.length) verlaufEntwurf = input.value;
                verlaufIdx = Math.max(0, verlaufIdx - 1);
                input.value = verlaufBefehle[verlaufIdx];
            } else if (e.key === 'ArrowDown') {
                if (verlaufIdx >= verlaufBefehle.length) return;
                e.preventDefault();
                verlaufIdx++;
                input.value = verlaufIdx === verlaufBefehle.length ? verlaufEntwurf : verlaufBefehle[verlaufIdx];
            } else return;
            const n = input.value.length; input.setSelectionRange(n, n);
        }

        function sendCommand() {
            const input = $("cmd-input");
            const cmd = input.value.trim();
            if (!cmd) return;
            verlaufMerken(cmd);
            fetch("/api/command", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: cmd })
            }).then(() => {
                input.value = "";
                updateData();
            });
        }

        function triggerShutdown() {
            if (!confirm("JARVIS beenden?")) return;
            isShuttingDown = true;
            $('status-display').innerText = "FÄHRT HERUNTER ...";
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            // keepalive: die Anfrage geht auch dann noch raus, wenn der Tab sofort geschlossen wird
            fetch("/api/shutdown", { method: "POST", keepalive: true }).catch(() => {});
            // warten, bis der Server wirklich weg ist, erst dann Fenster schließen
            let versuche = 0;
            const pruefe = setInterval(() => {
                versuche++;
                fetch("/api/data", { cache: "no-store" }).then(() => {
                    if (versuche > 24) { clearInterval(pruefe); $('status-display').innerText = "KERN ANTWORTET NOCH - Fenster 'JARVIS Kern' prüfen"; }
                }).catch(() => {
                    clearInterval(pruefe);
                    $('status-display').innerText = "OFFLINE - du kannst das Fenster schließen";
                    setTimeout(() => { window.close(); }, 600);
                });
            }, 500);
        }

        window.onload = function() {
            $('cmd-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendCommand(); else verlaufTaste(e); });
            tickClock(); setInterval(tickClock, 1000);
            updateData(); setInterval(updateData, 2000);
            ladeWetter();
            showTab('graph');                                   // Start mit dem Graph, der Baum ist der zweite Reiter
        };
    </script>
</body>
